<body>
    <div class="container">
        <header>
            <h1>cURL to Code Converter</h1>
            <p class="subtitle">Convert cURL commands to Python, JavaScript, Go, and Ruby</p>
        </header>

        <div class="grid full-width">
            <div class="card">
                <h2>cURL Command Input</h2>
                <label>Paste your cURL command</label>
                <textarea id="curlInput" placeholder="curl -X POST https://api.example.com/endpoint \\
  -H 'Content-Type: application/json' \\
  -H 'Authorization: Bearer token' \\
  -d '{\"key\": \"value\"}'"></textarea>
                <button onclick="convertCurl()">Convert</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="card full-width">
                <h2>Code Output</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab(0)">Python</button>
                    <button class="tab-btn" onclick="switchTab(1)">JavaScript</button>
                    <button class="tab-btn" onclick="switchTab(2)">Go</button>
                    <button class="tab-btn" onclick="switchTab(3)">Ruby</button>
                </div>

                <div class="tab-content active" id="tab0">
                    <button class="copy-btn" onclick="copyCode(0)">Copy</button>
                    <div class="code-output" id="code0"></div>
                </div>

                <div class="tab-content" id="tab1">
                    <button class="copy-btn" onclick="copyCode(1)">Copy</button>
                    <div class="code-output" id="code1"></div>
                </div>

                <div class="tab-content" id="tab2">
                    <button class="copy-btn" onclick="copyCode(2)">Copy</button>
                    <div class="code-output" id="code2"></div>
                </div>

                <div class="tab-content" id="tab3">
                    <button class="copy-btn" onclick="copyCode(3)">Copy</button>
                    <div class="code-output" id="code3"></div>
                </div>
            </div>
        </div>

        <footer>© 2026 kappafy.com — API Development Tools</footer>
    </div>

    <script>
        function convertCurl() {
            const curlStr = document.getElementById('curlInput').value.trim();
            if (!curlStr) {
                alert('Please paste a cURL command.');
                return;
            }

            const parsed = parseCurl(curlStr);

            // Generate code for each language
            const python = generatePython(parsed);
            const javascript = generateJavaScript(parsed);
            const golang = generateGo(parsed);
            const ruby = generateRuby(parsed);

            document.getElementById('code0').textContent = python;
            document.getElementById('code1').textContent = javascript;
            document.getElementById('code2').textContent = golang;
            document.getElementById('code3').textContent = ruby;

            document.getElementById('resultsSection').style.display = 'block';
        }

        function parseCurl(curlStr) {
            const result = {
                method: 'GET',
                url: '',
                headers: {},
                body: null
            };

            // Remove line continuations and clean up
            let cleaned = curlStr.replace(/\\\n\s*/g, ' ');

            // Extract method
            const methodMatch = cleaned.match(/-X\s+(\w+)/);
            if (methodMatch) result.method = methodMatch[1].toUpperCase();

            // Extract URL
            const urlMatch = cleaned.match(/(?:^|\s)(?:https?:\/\/\S+)/);
            if (urlMatch) result.url = urlMatch[0].trim();
            else {
                const quoteMatch = cleaned.match(/(?:^|\s)['"](?:https?:\/\/[^'"]+)['"]/);
                if (quoteMatch) result.url = quoteMatch[0].trim().replace(/['\"]/g, '');
            }

            // Extract headers
            const headerRegex = /-H\s+['"]([^'":]+):\s*([^'"]+)['"]/g;
            let match;
            while ((match = headerRegex.exec(cleaned)) !== null) {
                result.headers[match[1]] = match[2];
            }

            // Extract body
            const bodyMatch = cleaned.match(/-d\s+['"](.+?)['"]/);
            if (bodyMatch) {
                try {
                    result.body = JSON.parse(bodyMatch[1]);
                } catch {
                    result.body = bodyMatch[1];
                }
            }

            return result;
        }

        function generatePython(parsed) {
            let code = 'import requests\n\nurl = "' + parsed.url + '"\n';
            code += 'headers = {\n';
            Object.entries(parsed.headers).forEach(([k, v]) => {
                code += '    "' + k + '": "' + v + '",\n';
            });
            code += '}\n';

            if (parsed.body) {
                code += 'data = ' + JSON.stringify(parsed.body, null, 4) + '\n\n';
                code += 'response = requests.request("' + parsed.method + '", url, json=data, headers=headers)\n';
            } else {
                code += '\nresponse = requests.request("' + parsed.method + '", url, headers=headers)\n';
            }
            code += 'print(response.json())';
            return code;
        }

        function generateJavaScript(parsed) {
            let code = 'const options = {\n  method: "' + parsed.method + '",\n  headers: {\n';
            Object.entries(parsed.headers).forEach(([k, v]) => {
                code += '    "' + k + '": "' + v + '",\n';
            });
            code += '  },\n';

            if (parsed.body) {
                code += '  body: JSON.stringify(' + JSON.stringify(parsed.body, null, 4).split('\n').join('\n  ') + ')\n';
            }
            code += '};\n\n';
            code += 'fetch("' + parsed.url + '", options)\n';
            code += '  .then(response => response.json())\n';
            code += '  .then(data => console.log(data))\n';
            code += '  .catch(error => console.error("Error:", error));';
            return code;
        }

        function generateGo(parsed) {
            let code = 'package main\n\nimport (\n  "fmt"\n  "io"\n  "net/http"\n  "bytes"\n  "encoding/json"\n)\n\nfunc main() {\n';
            code += '  url := "' + parsed.url + '"\n';
            code += '  method := "' + parsed.method + '"\n\n';

            if (parsed.body) {
                code += '  payload := map[string]interface{}{\n';
                Object.entries(parsed.body).forEach(([k, v]) => {
                    code += '    "' + k + '": "' + v + '",\n';
                });
                code += '  }\n\n';
                code += '  payloadBytes, _ := json.Marshal(payload)\n';
                code += '  req, _ := http.NewRequest(method, url, bytes.NewBuffer(payloadBytes))\n';
            } else {
                code += '  req, _ := http.NewRequest(method, url, nil)\n';
            }

            code += '\n  req.Header.Add("Content-Type", "application/json")\n';
            Object.entries(parsed.headers).forEach(([k, v]) => {
                if (k.toLowerCase() !== 'content-type') {
                    code += '  req.Header.Add("' + k + '", "' + v + '")\n';
                }
            });

            code += '\n  client := &http.Client{}\n';
            code += '  res, _ := client.Do(req)\n';
            code += '  defer res.Body.Close()\n';
            code += '  body, _ := io.ReadAll(res.Body)\n';
            code += '  fmt.Println(string(body))\n';
            code += '}\n';
            return code;
        }

        function generateRuby(parsed) {
            let code = 'require "net/http"\nrequire "json"\n\n';
            code += 'uri = URI("' + parsed.url + '")\n';
            code += 'http = Net::HTTP.new(uri.host, uri.port)\n';
            code += 'http.use_ssl = (uri.scheme == "https")\n\n';

            code += 'request = Net::HTTP::' + parsed.method.charAt(0).toUpperCase() + parsed.method.slice(1).toLowerCase() + '.new(uri)\n';
            Object.entries(parsed.headers).forEach(([k, v]) => {
                code += 'request["' + k + '"] = "' + v + '"\n';
            });

            if (parsed.body) {
                code += 'request.body = ' + JSON.stringify(parsed.body, null, 0) + '.to_json\n';
            }

            code += '\nresponse = http.request(request)\n';
            code += 'puts JSON.parse(response.body)';
            return code;
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab' + idx).classList.add('active');
            document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        }

        function copyCode(idx) {
            const code = document.getElementById('code' + idx).textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied to clipboard!');
            });
        }
    </script>

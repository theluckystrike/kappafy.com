    <meta property="og:description" content="Design REST endpoints visually: method, path, query, body, response. Generate OpenAPI 3.0 YAML, curl, fetch/axios, Python requests. Copy to clipboard.">

<body>
<div class="container">
  <header>
    <h1>⚡ REST API Endpoint Builder</h1>
    <div class="subhead">Design & document endpoints · OpenAPI 3.0 · curl · fetch/axios · Python</div>
  </header>

  <div class="grid-2col">
    <!-- LEFT: Builder -->
    <div class="card">
      <h2>🔧 Endpoint Designer</h2>
      <div class="form-group">
        <label>HTTP method</label>
        <select id="httpMethod" onchange="toggleBody()">
          <option value="GET">GET</option>
          <option value="POST" selected>POST</option>
          <option value="PUT">PUT</option>
          <option value="PATCH">PATCH</option>
          <option value="DELETE">DELETE</option>
        </select>
      </div>
      <div class="form-group">
        <label>URL path (use :param for path variables)</label>
        <input type="text" id="urlPath" value="/api/users/:id" placeholder="/api/users/:id">
      </div>

      <!-- Query parameters -->
      <div class="form-group">
        <div class="flex items-center gap" style="justify-content: space-between;">
          <label>Query parameters</label>
          <button class="btn btn-sm btn-outline" onclick="addQueryParam()">+ Add</button>
        </div>
        <div id="queryParamsContainer"></div>
      </div>

      <!-- Request body (POST/PUT/PATCH) -->
      <div class="form-group" id="requestBodyGroup">
        <div class="flex items-center gap" style="justify-content: space-between;">
          <label>Request body fields (JSON schema)</label>
          <button class="btn btn-sm btn-outline" onclick="addBodyField()">+ Add</button>
        </div>
        <div id="bodyFieldsContainer"></div>
      </div>

      <!-- Response schema -->
      <div class="form-group">
        <label>Response status code</label>
        <input type="text" id="responseStatus" value="200" placeholder="200">
      </div>
      <div class="form-group">
        <div class="flex items-center gap" style="justify-content: space-between;">
          <label>Response body fields</label>
          <button class="btn btn-sm btn-outline" onclick="addResponseField()">+ Add</button>
        </div>
        <div id="responseFieldsContainer"></div>
      </div>

      <div class="btn-group" style="margin-top: 1rem;">
        <button class="btn" onclick="generateAll()">🔄 Generate code</button>
      </div>
    </div>

    <!-- RIGHT: Output -->
    <div class="card">
      <h2>📄 Generated Snippets</h2>
      <div id="outputArea">
        <p style="color: #64748b; font-style: italic;">Click "Generate code" to preview OpenAPI, curl, JS, Python.</p>
      </div>
    </div>
  </div>

  <footer class="footer">© 2025 kappafy.com</footer>
<div style="margin:20px auto;max-width:728px;text-align:center">

<script>
  // ---------- state ----------
  let queryParams = [];
  let bodyFields = [];
  let responseFields = [];

  // ---------- init ----------
  window.addEventListener('DOMContentLoaded', () => {
    addQueryParam(); addQueryParam(); // two examples
    addBodyField();
    addResponseField();
    toggleBody();
    generateAll();
  });

  function toggleBody() {
    const method = document.getElementById('httpMethod').value;
    const group = document.getElementById('requestBodyGroup');
    group.style.display = (method === 'POST' || method === 'PUT' || method === 'PATCH') ? 'block' : 'none';
  }

  // ---------- add / remove helpers ----------
  function addQueryParam() {
    queryParams.push({ key: '', type: 'string', required: false, description: '' });
    renderQueryParams();
  }
  function removeQueryParam(index) {
    queryParams.splice(index, 1);
    renderQueryParams();
  }
  function renderQueryParams() {
    const container = document.getElementById('queryParamsContainer');
    container.innerHTML = queryParams.map((p, i) => `
      <div class="param-item">
        <div class="row">
          <input type="text" value="${escapeHtml(p.key)}" placeholder="key" onchange="updateQuery(${i},'key',this.value)">
          <select onchange="updateQuery(${i},'type',this.value)"><option value="string" ${p.type==='string'?'selected':''}>string</option><option value="integer" ${p.type==='integer'?'selected':''}>integer</option><option value="boolean" ${p.type==='boolean'?'selected':''}>boolean</option></select>
          <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;color:#94a3b8;"><input type="checkbox" ${p.required?'checked':''} onchange="updateQuery(${i},'required',this.checked)"> required</label>
          <input type="text" value="${escapeHtml(p.description)}" placeholder="desc" onchange="updateQuery(${i},'description',this.value)">
          <button class="btn-remove" onclick="removeQueryParam(${i})">✕</button>
        </div>
      </div>
    `).join('');
  }
  function updateQuery(idx, field, val) {
    queryParams[idx][field] = val;
  }

  // body fields
  function addBodyField() {
    bodyFields.push({ name: '', type: 'string', description: '' });
    renderBodyFields();
  }
  function removeBodyField(index) {
    bodyFields.splice(index, 1);
    renderBodyFields();
  }
  function renderBodyFields() {
    const container = document.getElementById('bodyFieldsContainer');
    container.innerHTML = bodyFields.map((f, i) => `
      <div class="param-item">
        <div class="row">
          <input type="text" value="${escapeHtml(f.name)}" placeholder="field name" onchange="updateBody(${i},'name',this.value)">
          <select onchange="updateBody(${i},'type',this.value)"><option value="string" ${f.type==='string'?'selected':''}>string</option><option value="integer" ${f.type==='integer'?'selected':''}>integer</option><option value="boolean" ${f.type==='boolean'?'selected':''}>boolean</option><option value="object" ${f.type==='object'?'selected':''}>object</option><option value="array" ${f.type==='array'?'selected':''}>array</option></select>
          <input type="text" value="${escapeHtml(f.description)}" placeholder="desc" onchange="updateBody(${i},'description',this.value)">
          <button class="btn-remove" onclick="removeBodyField(${i})">✕</button>
        </div>
      </div>
    `).join('');
  }
  function updateBody(idx, field, val) {
    bodyFields[idx][field] = val;
  }

  // response fields
  function addResponseField() {
    responseFields.push({ name: '', type: 'string', description: '' });
    renderResponseFields();
  }
  function removeResponseField(index) {
    responseFields.splice(index, 1);
    renderResponseFields();
  }
  function renderResponseFields() {
    const container = document.getElementById('responseFieldsContainer');
    container.innerHTML = responseFields.map((f, i) => `
      <div class="param-item">
        <div class="row">
          <input type="text" value="${escapeHtml(f.name)}" placeholder="field name" onchange="updateResponse(${i},'name',this.value)">
          <select onchange="updateResponse(${i},'type',this.value)"><option value="string" ${f.type==='string'?'selected':''}>string</option><option value="integer" ${f.type==='integer'?'selected':''}>integer</option><option value="boolean" ${f.type==='boolean'?'selected':''}>boolean</option><option value="object" ${f.type==='object'?'selected':''}>object</option><option value="array" ${f.type==='array'?'selected':''}>array</option></select>
          <input type="text" value="${escapeHtml(f.description)}" placeholder="desc" onchange="updateResponse(${i},'description',this.value)">
          <button class="btn-remove" onclick="removeResponseField(${i})">✕</button>
        </div>
      </div>
    `).join('');
  }
  function updateResponse(idx, field, val) {
    responseFields[idx][field] = val;
  }

  // ---------- generate ----------
  function generateAll() {
    const method = document.getElementById('httpMethod').value;
    const rawPath = document.getElementById('urlPath').value.trim() || '/';
    const statusCode = document.getElementById('responseStatus').value.trim() || '200';

    // build path parameters from :segments
    const pathParams = [];
    const pathWithColons = rawPath.replace(/:([a-zA-Z_][a-zA-Z0-9_]*)/g, (match, p1) => {
      pathParams.push(p1);
      return `{${p1}}`;
    });

    // query
    const queryList = queryParams.filter(q => q.key.trim() !== '');
    // body
    const bodyList = bodyFields.filter(b => b.name.trim() !== '');
    // response
    const respList = responseFields.filter(r => r.name.trim() !== '');

    // ----- OpenAPI 3.0 YAML -----
    let openapiYaml = `openapi: "3.0.3"\ninfo:\n  title: Endpoint Builder\n  version: "1.0"\npaths:\n  ${rawPath}:\n    ${method.toLowerCase()}:\n      summary: Generated endpoint\n      parameters:\n`;
    // path params
    pathParams.forEach(p => {
      openapiYaml += `        - name: ${p}\n          in: path\n          required: true\n          schema:\n            type: string\n          description: Path parameter\n`;
    });
    // query params
    queryList.forEach(q => {
      openapiYaml += `        - name: ${q.key}\n          in: query\n          required: ${q.required}\n          schema:\n            type: ${q.type}\n          description: "${q.description || ''}"\n`;
    });
    if (pathParams.length === 0 && queryList.length === 0) openapiYaml += `        []\n`;
    // requestBody
    if ((method === 'POST' || method === 'PUT' || method === 'PATCH') && bodyList.length > 0) {
      openapiYaml += `      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n`;
      bodyList.forEach(b => {
        openapiYaml += `                ${b.name}:\n                  type: ${b.type}\n                  description: "${b.description || ''}"\n`;
      });
    }
    // responses
    openapiYaml += `      responses:\n        '${statusCode}':\n          description: Successful response\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n`;
    if (respList.length === 0) {
      openapiYaml += `                  message:\n                    type: string\n                    example: "ok"\n`;
    } else {
      respList.forEach(r => {
        openapiYaml += `                  ${r.name}:\n                    type: ${r.type}\n                    description: "${r.description || ''}"\n`;
      });
    }

    // ----- curl -----
    let curlCmd = `curl -X ${method} "https://api.example.com${rawPath}"`;
    if (queryList.length > 0) {
      const qs = queryList.map(q => `${q.key}=${q.type==='string'?'value':1}`).join('&');
      curlCmd += `?${qs}`;
    }
    if ((method === 'POST' || method === 'PUT' || method === 'PATCH') && bodyList.length > 0) {
      const bodyObj = {};
      bodyList.forEach(b => { bodyObj[b.name] = b.type==='string'?'example':1; });
      curlCmd += ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(bodyObj)}'`;
    }

    // ----- fetch / axios (JS) -----
    let jsCode = '';
    const jsMethod = method;
    let jsUrl = `https://api.example.com${rawPath}`;
    if (queryList.length > 0) {
      const qs = queryList.map(q => `${q.key}: ${q.type==='string'?'"value"':1}`).join(', ');
      jsUrl += `?${queryList.map(q => `${q.key}=${q.type==='string'?'value':1}`).join('&')}`;
    }
    let bodyContent = null;
    if ((method === 'POST' || method === 'PUT' || method === 'PATCH') && bodyList.length > 0) {
      const bObj = {};
      bodyList.forEach(b => { bObj[b.name] = b.type==='string'?'"example"':1; });
      bodyContent = JSON.stringify(bObj);
    }
    // fetch
    jsCode = `// Fetch\nfetch("${jsUrl}", {\n  method: "${jsMethod}",\n  headers: { "Content-Type": "application/json" }${bodyContent ? ',' : ''}\n${bodyContent ? `  body: ${bodyContent}\n` : ''}}).then(res => res.json()).then(console.log);\n\n// Axios\nimport axios from 'axios';\naxios.${jsMethod.toLowerCase()}("${jsUrl}"${bodyContent ? `, ${bodyContent}` : ''})\n  .then(res => console.log(res.data));`;

    // ----- Python requests -----
    let pyCode = `import requests\n\nurl = "${jsUrl}"\nheaders = {"Content-Type": "application/json"}\n`;
    if (bodyContent) {
      pyCode += `data = ${bodyContent}\nresponse = requests.${jsMethod.toLowerCase()}(url, headers=headers, json=data)\n`;
    } else {
      pyCode += `response = requests.${jsMethod.toLowerCase()}(url, headers=headers)\n`;
    }
    pyCode += `print(response.json())\n`;

    // render output
    const output = document.getElementById('outputArea');
    output.innerHTML = `
      <div class="code-block"><button class="copy-btn" onclick="copyText(this)">📋 copy</button><pre>${escapeHtml(openapiYaml)}</pre></div>
      <div class="code-block"><button class="copy-btn" onclick="copyText(this)">📋 copy</button><pre>${escapeHtml(curlCmd)}</pre></div>
      <div class="code-block"><button class="copy-btn" onclick="copyText(this)">📋 copy</button><pre>${escapeHtml(jsCode)}</pre></div>
      <div class="code-block"><button class="copy-btn" onclick="copyText(this)">📋 copy</button><pre>${escapeHtml(pyCode)}</pre></div>
    `;
  }

  // ---------- utilities ----------
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function copyText(btn) {
    const pre = btn.parentElement.querySelector('pre');
    if (!pre) return;
    const text = pre.innerText;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ copied';
      setTimeout(() => { btn.textContent = '📋 copy'; }, 1500);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      btn.textContent = '✅ copied';
      setTimeout(() => { btn.textContent = '📋 copy'; }, 1500);
    });
  }

  // additional: regenerate on any change? we keep manual, but auto on method change
  document.getElementById('httpMethod').addEventListener('change', () => { toggleBody(); generateAll(); });
  document.getElementById('urlPath').addEventListener('input', generateAll);
  document.getElementById('responseStatus').addEventListener('input', generateAll);
  // but for param fields we rely on generate button, but we can also call generateAll after changes? we'll keep manual.
  // but we add listeners to inputs inside param items? they update state but not regenerate. user clicks generate.
  // we also call generateAll on init.
</script>
</body>
